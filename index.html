        .calculator {
            border: 1px solid #717377;
            padding: 21px;
            border-radius: 16px;
            background: transparent;
            box-shadow: 0 4px 17px rgba(133, 115, 119, 0.5);
        }

        input {
            width: 320px;
            border: none;
            outline: none;
            padding: 24px;
            margin: 10px;
            background: transparent;
            color: #ffffffc1;
            box-shadow: 0 3px 15px rgba(84, 84, 84, 0.1);
            font-size: 40px;
            text-align: right;
            cursor: pointer;
        }

        input::placeholder {
            color: #fff;
        }

        button {
            width: 60px;
            height: 60px;
            margin: 10px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #ffffffd3;
            font-size: 20px;
            box-shadow: -8px -8px 15px rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .equalBtn {
            background: rgba(231, 164, 41, 0.746);
        }

        .operator {
            color: #68e276;
        }

        h1 {
            color: rgb(225, 232, 235);
            margin-bottom: 20px;
            font-size: 40px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            border-bottom: 1px solid black;
            box-shadow: 0px 3px 3px 0px rgba(187, 206, 216, 0.663);
            letter-spacing: 4px;

            /* space between heading & calculator */
        }
    </style>
</head>

<body>


    <h1>Calculator</h1>

    <div class="calculator">
        <input type="text" placeholder="0" id="inputBox">
        <div>
            <button class="operator">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
        </div>

        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
        </div>

        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>

        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
        </div>

        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalBtn">=</button>
        </div>
    </div>

    <script>
        let input = document.getElementById('inputBox');
        let buttons = document.querySelectorAll('button');

        // Emty string for result store execute on input 
        let string = "";
        let arr = Array.from(buttons);
        arr.forEach(button => {
            button.addEventListener('click', (e) => {
                if (e.target.innerHTML == '=') {
                    string = eval(string);
                    input.value = string;
                }

                else if (e.target.innerHTML == 'AC') {
                    string = "";
                    input.value = string;
                }

                else if (e.target.innerHTML == 'DEL') {
                    string = string.substring(0, string.length - 1);
                    input.value = string;
                }

                else {
                    string += e.target.innerHTML;
                    input.value = string;
                }
            });
        }); 
    </script>
</body>

</html>
